$kind: http-request
name: Clear room secret
method: DELETE
url: '{{base_url}}/api/rooms/{{room_id}}/secret'
order: 4000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('the room is public again', function () {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().data.has_secret).to.eql(false);
      });
