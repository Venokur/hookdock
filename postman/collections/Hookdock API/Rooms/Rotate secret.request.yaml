$kind: http-request
name: Rotate room secret
method: POST
url: '{{base_url}}/api/rooms/{{room_id}}/secret'
order: 3000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // The secret is returned exactly once, because an HMAC cannot be verified
      // against a hash. Reads of the room expose only `has_secret`.
      pm.test('the secret is returned once', function () {
        pm.response.to.have.status(200);
        const body = pm.response.json();
        pm.expect(body.data.secret).to.be.a('string').and.not.empty;
        pm.expect(body.data.has_secret).to.eql(true);
      });
      const body = pm.response.json();
      if (body.data && body.data.secret) {
        pm.collectionVariables.set('room_secret', body.data.secret);
      }
