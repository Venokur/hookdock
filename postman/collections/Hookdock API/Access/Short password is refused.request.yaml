$kind: http-request
name: Short password is refused
method: PUT
url: '{{base_url}}/api/users/{{admin_id}}'
order: 5000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "password": "short"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // Length is the only rule, and the upper bound is not cosmetic: bcrypt
      // silently truncates at 72 bytes. Composition rules are deliberately absent —
      // they push people towards `Password1!`, which is not stronger.
      pm.test('a password shorter than 8 characters is refused', function () {
        pm.response.to.have.status(422);
        pm.expect(pm.response.json().error.message).to.include('8');
      });
