$kind: http-request
name: Metrics
method: GET
url: '{{base_url}}/api/metrics'
auth:
  type: noauth
order: 4000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // Public like `/api/health`: a scrape config has no credentials. The body is
      // the Prometheus exposition format, so it is asserted as text, not JSON.
      pm.test('metrics are public Prometheus text', function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 503]);
        pm.expect(pm.response.headers.get('Content-Type')).to.include('text/plain');
      });
  - type: afterResponse
    language: text/javascript
    code: |-
      const text = pm.response.text();

      pm.test('the exposition declares types once per metric', function () {
        pm.expect(text).to.match(/^# TYPE hookdock_api_up gauge$/m);
        pm.expect(text).to.match(/^hookdock_api_up 1$/m);
        pm.expect(text).to.match(/^hookdock_runs\{status="failed"\} \d+$/m);
      });

      pm.test('no payload and no forward address leaks', function () {
        // A breaker metric carries a count on purpose: an address is an internal
        // hostname and a public scrape must not learn it.
        pm.expect(text).to.not.match(/hookdock_breaker_open\{/);
        pm.expect(text).to.not.match(/admin@/);
      });
