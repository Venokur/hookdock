openapi: 3.0.3
info:
  title: Hookdock API
  version: 1.0.0
  description: |
    Hookdock stores incoming webhooks in rooms and routes them through rules
    («сценарии»). Ingestion is asynchronous: the catcher answers `202` with
    `queued: N` and a separate worker performs the actions, so a slow forward
    target never delays the sender.

    Two audiences share this document:

    * **The dashboard API** (`/api/...`) — everything under `/api` except the
      catcher requires a Bearer token. Lists answer `{"data": …}` and add `meta`
      for pagination. Errors are `{"error":{"message":"…"}}` with Russian text,
      which is what the UI shows.
    * **The catcher** (`/hook/...` and `/api/webhook/...`) — public by design. A
      room with an HMAC secret only accepts requests carrying
      `X-Hookdock-Signature`, optionally bound to a `X-Hookdock-Timestamp` so a
      captured request cannot be replayed. A room can also deduplicate deliveries
      by one header, so a retried event runs the room's rules once, and restrict
      the sender addresses it accepts (`ip_allowlist`), so a payload copied from a
      log cannot be replayed from an unrelated host.

    Scopes: a login token carries `scope: api` and may do anything; a token from
    `POST /api/auth/read-token` carries `scope: read` and is refused with `403` on
    every mutating endpoint.

    Roles: the account itself is `admin`, `editor` or `viewer` (`/api/users`). A
    role and a scope answer different questions and both are enforced — the scope
    limits the credential, the role limits the person — so a `viewer` is refused
    every write no matter which token they hold, and only an `admin` may manage
    accounts, grant roles or issue a token.

    Long-lived tokens: `POST /api/tokens` issues a `hd_…` key with the same
    `scope` vocabulary, for a script that cannot hold a 12h session. It is stored
    as a SHA-256 hash and can be revoked, which is the difference between it and
    a JWT. Its role still comes from the account that issued it.
  license:
    name: MIT
servers:
  - url: http://localhost:8080
    description: Local development stack (`docker compose up -d`)

tags:
  - name: Health
  - name: Auth
  - name: Rooms
  - name: Requests
  - name: Runs
  - name: Workflows
  - name: Access
    description: |
      Accounts, their roles, the journal of who changed what, and the long-lived
      tokens scripts authenticate with. A role change takes effect on the next
      request because the role lives on the user, not in the token.
  - name: Delivery
    description: |
      Forward targets the circuit breaker is skipping, and moving a room's rule
      set between installations.
  - name: Ingest

security:
  - bearerAuth: []

paths:
  /api/health:
    get:
      tags: [Health]
      summary: Readiness of the installation
      description: |
        Public on purpose: an uptime probe has no credentials, and the answer
        carries no payloads, room names or secrets.

        `503` means "not ready" — the database is unreachable, the oldest
        `pending` run is older than `HEALTH_QUEUE_MAX_AGE`, or there is queued
        work while no worker has beaten within `WORKER_STALE_SECONDS`. A worker
        that never beat on an **empty** installation is not a failure: a fresh
        volume is healthy before the first loop pass.
      security: []
      responses:
        '200':
          description: Everything is draining.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: At least one check failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Exchange email and password for a token
      description: |
        Rate limited per account (`LOGIN_MAX_ATTEMPTS`, 10/min) and, more
        loosely, per address (`LOGIN_IP_MAX_ATTEMPTS`, 50/min). A refused attempt
        answers `429` with `Retry-After`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: admin@hookdock.local
                password:
                  type: string
                  format: password
                  example: '123456'
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                type: object
                required: [token, user]
                properties:
                  token:
                    type: string
                    description: 'HS256 JWT with `scope: api`, valid for `JWT_TTL` (12 h).'
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/auth/config:
    get:
      tags: [Auth]
      summary: What the login page may reveal
      description: |
        The demo account is returned only when `DEMO_LOGIN=1`, so credentials are
        never baked into the JS bundle. `warnings` reports configuration that must
        not reach production (`JWT_SECRET` left at its default, demo login on).
      security: []
      responses:
        '200':
          description: Public configuration.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      demo:
                        type: object
                        nullable: true
                        properties:
                          email:
                            type: string
                          password:
                            type: string
                      warnings:
                        type: array
                        items:
                          type: string

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Current user and token scope
      responses:
        '200':
          description: The signed-in user.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    allOf:
                      - $ref: '#/components/schemas/User'
                      - type: object
                        properties:
                          last_login_at:
                            type: string
                            format: date-time
                            nullable: true
                          scope:
                            type: string
                            enum: [api, read]
                            description: |
                              What this token may do. `read` means every mutating
                              endpoint will answer `403`.
                          can_write:
                            type: boolean
                            description: Role and scope folded into one flag.
                          can_admin:
                            type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/read-token:
    post:
      tags: [Auth]
      summary: Issue a read-only token
      description: |
        For a dashboard, a script or a colleague who needs the log but must not be
        able to `DELETE /api/rooms/{id}`.

        Requires a full `api` token — a read token cannot mint another one. The
        token lives as long as a login token (`JWT_TTL`) and is revoked by rotating
        `JWT_SECRET`; there is no per-token revocation list.
      responses:
        '200':
          description: A token that can only read.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                      scope:
                        type: string
                        enum: [read]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ReadOnly'

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: No-op logout
      description: Tokens are stateless; the client discards its copy.
      responses:
        '200':
          description: Acknowledged.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true

  /api/auth/password:
    post:
      tags: [Auth]
      summary: Change your own password
      description: |
        Requires the current password: a stolen token must not be a permanent
        account takeover. Needs no `admin` role — every account may rotate its own
        credential — but a `scope: read` token is refused with `403`, because
        changing a password is a write.

        Length is the only rule (8–72 bytes). Composition requirements («one digit,
        one symbol») are a documented way to make passwords worse, and bcrypt
        silently truncates at 72 bytes, so the upper bound is not cosmetic.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password]
              properties:
                current_password:
                  type: string
                password:
                  type: string
                  minLength: 8
                  maxLength: 72
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ReadOnly'
        '422':
          $ref: '#/components/responses/Invalid'

  /api/users:
    get:
      tags: [Access]
      summary: List accounts
      description: |
        Administrator only. Accounts carry a role (`admin`, `editor`, `viewer`)
        that decides what the person may do; a token scope decides what the
        credential may do, and both are enforced — `scope: read` refuses every
        write no matter the role, and `viewer` refuses every write no matter the
        scope.

        The role lives on the user, not in the token, so a demotion takes effect on
        the next request instead of when the 12h token expires.
      responses:
        '200':
          description: Every account, oldest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminOnly'
    post:
      tags: [Access]
      summary: Create an account
      description: |
        Administrator only. The password is hashed on the server; a client cannot
        send a pre-hashed value. `role` defaults to `editor`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                  maxLength: 72
                role:
                  $ref: '#/components/schemas/Role'
      responses:
        '201':
          description: The new account.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminOnly'
        '422':
          $ref: '#/components/responses/Invalid'

  /api/users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      tags: [Access]
      summary: Rename an account or change its role
      description: |
        Administrator only, and omitting a field keeps it.

        Two guards keep an installation recoverable: nobody can drop their own
        `admin` role, and the last administrator cannot be demoted or deleted —
        either would leave no account able to grant roles again, which no endpoint
        could undo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                role:
                  $ref: '#/components/schemas/Role'
                password:
                  type: string
                  minLength: 8
                  maxLength: 72
                  description: |
                    Optional reset. Only the fact that it changed is journalled,
                    never the hash or the value.
      responses:
        '200':
          description: The updated account.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminOnly'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
    delete:
      tags: [Access]
      summary: Delete an account
      description: |
        Administrator only. Deleting yourself is refused, and so is deleting the
        last administrator. Journal entries about the account stay: `actor_email`
        and `object_label` are copies, so the log still explains what it did.
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  deleted:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminOnly'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'

  /api/tokens:
    get:
      tags: [Tokens]
      summary: List long-lived API tokens
      description: |
        Never returns the token itself — only `prefix`, which tells two keys apart
        and is useless as a credential. `revoked` and `expired` are derived from
        `revoked_at` / `expires_at` at read time, so the list cannot go stale.

        Admin-only: a token acts as its account, so seeing which keys exist is the
        same privilege as creating one.
      responses:
        '200':
          description: Every token of the installation, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ReadOnly'
    post:
      tags: [Tokens]
      summary: Issue a token
      description: |
        The plaintext is returned **once**, in the `201`, like a room's HMAC
        secret. The owner is the account that issued it — there is no `user_id` in
        the body, because a key that belongs to somebody else makes "who used this"
        unanswerable.

        `scope` defaults to `read`: the safer credential is the one you get when
        you do not ask. `expires_at` is an absolute moment; an omitted value means
        the key does not expire, which is what an integration nobody plans to
        rotate needs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 120
                  example: Ночной экспорт
                scope:
                  type: string
                  enum: [api, read]
                  default: read
                expires_at:
                  type: string
                  nullable: true
                  description: |
                    ISO-8601 moment (`2027-01-31T00:00:00Z`) or a bare date
                    (`2027-01-31`, meaning the end of that day). A moment in the
                    past is `422`, not a dead key that looks active.
                  example: '2027-01-31T00:00:00Z'
      responses:
        '201':
          description: Issued. `token` is present only here.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/ApiToken'
                      - type: object
                        properties:
                          token:
                            type: string
                            description: Shown exactly once.
                            example: hd_e855cf57688dc8d7…
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ReadOnly'
        '422':
          $ref: '#/components/responses/Invalid'

  /api/tokens/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    delete:
      tags: [Tokens]
      summary: Revoke a token
      description: |
        The row is kept and `revoked_at` is set: a revoked key fails on the next
        request, and `last_used_at` still answers "was the leaked key used before
        we noticed". Revoking an already-revoked token is a `200` no-op with
        `already: true`; an id that never existed is `404`.
      responses:
        '200':
          description: Revoked (or already was).
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  revoked:
                    type: boolean
                  already:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ReadOnly'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/audit:
    get:
      tags: [Access]
      summary: Who changed what
      description: |
        The journal of changes made through the dashboard, newest first. Readable
        by every role — an editor who cannot see why a rule changed is left
        guessing — and writable by nobody: the entries are appended by the
        mutating handlers themselves.

        It is installation-wide by default and narrowed with `?room=`, because
        "what happened in this room" and "what did this person do" are different
        questions. `room` also matches the copied `room_slug`, so the entries of a
        deleted room stay findable after its `room_id` was set to `NULL`.

        `changes` is `{field: [before, after]}`. Signature secrets never appear:
        both sides of a diff are redacted first. A diff larger than 4 KB is
        replaced by a size marker instead of a misleading excerpt.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: room
          in: query
          schema:
            type: string
          description: Room slug. Omitted = every room.
        - name: action
          in: query
          schema:
            type: string
            example: workflow.updated
          description: |
            Exact action (`room.created`, `workflow.updated`, `user.deleted`, …).
            `all` and an empty value mean "any".
        - name: object_type
          in: query
          schema:
            type: string
            enum: [room, workflow, request, workflow_run, user, forward_target]
        - name: actor
          in: query
          schema:
            type: string
          description: Substring of the actor's email.
        - name: q
          in: query
          schema:
            type: string
          description: Substring of the summary or the object label.
      responses:
        '200':
          description: A page of the journal.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEntry'
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/Pagination'
                      - type: object
                        properties:
                          actions:
                            type: array
                            items:
                              type: string
                            description: The known action names, for the filter dropdown.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Invalid'

  /api/ws/ticket:
    post:
      tags: [Auth]
      summary: Short-lived ticket for the realtime socket
      description: |
        Browsers cannot send an `Authorization` header on `WebSocket()`, and the
        12 h API token must not travel in a query string. The ticket is a
        `scope: ws` JWT valid for `WS_TICKET_TTL` (60 s) and is accepted **only**
        by the websocket handshake — it returns `401` on every REST route.
      responses:
        '200':
          description: A single-use handshake credential.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      ticket:
                        type: string
                      expires_in:
                        type: integer
                        example: 60
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/rooms:
    get:
      tags: [Rooms]
      summary: Page through rooms with their counters
      description: |
        A **page**, not the whole table: the sidebar loads the latest 20 and
        searches the rest. A search returns up to 50 and keeps alphabetical order.

        Counters (`requests_total`, `workflows_active`, `failed_runs_24h`, …) are
        computed only for the returned page.

        `?slug=` is an exact lookup used to resolve a deep link to a room older
        than the page: it answers `200` with an empty list for an unknown slug,
        because the caller asks "does this exist", not "filter a log".
      parameters:
        - name: q
          in: query
          description: Case-insensitive substring of the name or slug.
          schema:
            type: string
        - name: slug
          in: query
          description: Exact slug lookup (case-insensitive).
          schema:
            type: string
        - name: limit
          in: query
          description: Defaults to 20 without `q` and 50 with it; clamped to 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: A page of rooms.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RoomCounters'
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
                      limit:
                        type: integer
                      returned:
                        type: integer
                      has_more:
                        type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Rooms]
      summary: Create a room
      description: |
        `slug` and `endpoint` are generated when omitted (`slug` is two 12-hex
        groups, `endpoint` is `hook-` + 6 hex). A duplicate slug is never resolved
        silently: the answer is `422` so the client draws a new one.

        `require_signature: true` issues the HMAC secret inside the same `INSERT`
        and returns it **once** in this response, so a room is never listed as
        public after an operator asked for a signature.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 120
                  example: Stripe
                slug:
                  type: string
                  pattern: '^[a-z0-9][a-z0-9-]{0,63}$'
                  description: Optional; generated when empty.
                endpoint:
                  type: string
                  maxLength: 64
                  description: Optional; generated when empty.
                require_signature:
                  type: boolean
                  default: false
                dedup_header:
                  type: string
                  nullable: true
                  maxLength: 64
                  description: Optional delivery-id header; empty or omitted means off.
                  example: X-GitHub-Delivery
                require_timestamp:
                  type: boolean
                  default: false
                  description: Require `X-Hookdock-Timestamp`; meaningful only with a secret.
                ip_allowlist:
                  type: array
                  maxItems: 64
                  description: |
                    Sender ranges. Omitted or empty accepts everyone. An entry that
                    is not an address or CIDR answers `422` naming the value, so
                    the operator does not have to guess which of twenty is wrong.
                  items:
                    type: string
      responses:
        '201':
          description: Created. `secret` is present only when a signature was requested.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/Room'
                      - type: object
                        properties:
                          secret:
                            type: string
                            description: Shown exactly once; reads expose `has_secret` instead.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ReadOnly'
        '422':
          $ref: '#/components/responses/Invalid'

  /api/rooms/{id}:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      tags: [Rooms]
      summary: Read one room
      responses:
        '200':
          description: The room.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Room'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Rooms]
      summary: Rename a room or change its advertised endpoint
      description: |
        The slug changes **only** when sent explicitly, because external
        integrations already use the address; an explicitly empty value asks for a
        fresh random one. An omitted `endpoint` keeps the current value.

        `dedup_header`, `require_timestamp` and `ip_allowlist` follow the same
        rule: omitted keeps the stored value, `dedup_header: ""` turns
        deduplication off, and `ip_allowlist: []` opens the room to every sender.
        For the allowlist the rule is load-bearing: a rename form that does not
        show the field must not silently disable it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                slug:
                  type: string
                endpoint:
                  type: string
                dedup_header:
                  type: string
                  nullable: true
                  maxLength: 64
                require_timestamp:
                  type: boolean
                ip_allowlist:
                  type: array
                  maxItems: 64
                  items:
                    type: string
                  description: Omitted keeps the current list; `[]` disables it.
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Room'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ReadOnly'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
    delete:
      tags: [Rooms]
      summary: Delete a room and everything in it
      description: Requests, workflows, runs and steps are removed by `ON DELETE CASCADE`.
      responses:
        '200':
          description: Deleted (or already gone).
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  deleted:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ReadOnly'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/rooms/{id}/secret:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    post:
      tags: [Rooms]
      summary: Issue or rotate the room's HMAC secret
      description: |
        Rotating silently breaks every sender still signing with the old value,
        which is why the SPA confirms first. The value is returned exactly once.
      responses:
        '200':
          description: The new secret.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      secret:
                        type: string
                      has_secret:
                        type: boolean
                        example: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ReadOnly'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Rooms]
      summary: Remove the secret, making the room public again
      responses:
        '200':
          description: The old secret stops working immediately.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      has_secret:
                        type: boolean
                        example: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ReadOnly'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/stats:
    get:
      tags: [Requests]
      summary: Counters for the dashboard header
      parameters:
        - $ref: '#/components/parameters/RoomSlug'
      responses:
        '200':
          description: Installation-wide counters, or one room's.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      requests_total:
                        type: integer
                      requests_last_hour:
                        type: integer
                      requests_last_24h:
                        type: integer
                      workflows_active:
                        type: integer
                      workflows_auto_paused:
                        type: integer
                        description: Rules the worker paused after repeated failures.
                      failed_runs_24h:
                        type: integer
                      queued_runs:
                        type: integer
                        description: Runs accepted but not finished yet.
                      endpoints:
                        type: array
                        description: The 15 most frequent endpoints, for the closed filter.
                        items:
                          type: object
                          properties:
                            endpoint:
                              type: string
                            total:
                              type: integer
                      endpoints_total:
                        type: integer
                      endpoints_limit:
                        type: integer
                        example: 15
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/analytics:
    get:
      tags: [Runs]
      summary: Throughput and latency over a window
      description: |
        `stats` answers "how many right now"; this answers "how did it behave",
        which needs a time axis: volume per hour, the outcome mix, and how long
        the actions actually took.

        Latency comes from `workflow_run_steps`, the only place that knows how long
        an action took. Two `forward`s that both ended `success` can differ by
        seconds, and a p95 that creeps up is the first sign of a target degrading.

        `success_rate` is computed over **finished** runs only: a run still in the
        queue has no outcome, and counting it as "not successful" would make the
        rate drop every time the worker is briefly behind. It is `null` when
        nothing finished in the window.

        `timeline` has one entry per hour and includes the hour in progress. Hours
        with no traffic are present with zeroes, so a silent hour is a flat bar
        rather than a gap that reads as a bug. Buckets are UTC.
      parameters:
        - $ref: '#/components/parameters/RoomSlug'
        - name: hours
          in: query
          description: Window in hours. Clamped to 1…168; `0` falls back to 24.
          schema:
            type: integer
            minimum: 1
            maximum: 168
            default: 24
      responses:
        '200':
          description: Counters, breakdowns and the hourly timeline.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analytics'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/metrics:
    get:
      tags: [Health]
      summary: The installation as Prometheus metrics
      description: |
        The exposition format (`text/plain; version=0.0.4`), for a scraper.

        Public on purpose, like `/api/health`: a scrape config has no credentials.
        The body carries counters only — never a payload, a room name or a forward
        address. `hookdock_breaker_open` is therefore a count with no `address`
        label, because a forward target is an internal hostname.

        Answers `503` when a check failed, while still emitting every metric it
        could read, so a broken installation keeps producing numbers.
      security: []
      responses:
        '200':
          description: Every check passed.
          content:
            text/plain:
              schema:
                type: string
                example: |
                  hookdock_api_up 1
                  hookdock_runs_pending 0
                  hookdock_runs{status="failed"} 3
        '503':
          description: A check failed; the body is still the full exposition.
          content:
            text/plain:
              schema:
                type: string

  /api/endpoints:
    get:
      tags: [Requests]
      summary: Search the room's endpoints
      description: |
        `stats` returns only the 15 most frequent, which is what the closed filter
        shows. This route reaches the rest: the operator types into the same field
        and gets matches from every endpoint, not only the visible page.
      parameters:
        - $ref: '#/components/parameters/RoomSlug'
        - name: q
          in: query
          description: Case-insensitive substring.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 15
      responses:
        '200':
          description: Matching endpoints with hit counts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        endpoint:
                          type: string
                        total:
                          type: integer
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
                      limit:
                        type: integer
                      returned:
                        type: integer
                      has_more:
                        type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/requests:
    get:
      tags: [Requests]
      summary: Page through the captured log
      parameters:
        - $ref: '#/components/parameters/RoomSlug'
        - name: method
          in: query
          schema:
            type: string
            example: POST
        - name: endpoint
          in: query
          schema:
            type: string
        - name: q
          in: query
          description: |
            Substring of the path, endpoint, raw body or header block. The header
            branch is the only way to answer "which delivery carried
            `X-GitHub-Event: push`"; it compares the text form of the `headers`
            jsonb, which is the expression the trigram index is declared on.
          schema:
            type: string
        - name: from
          in: query
          description: Inclusive lower bound on `received_at` (anything `DateTimeImmutable` parses).
          schema:
            type: string
        - name: to
          in: query
          description: Inclusive upper bound on `received_at`.
          schema:
            type: string
        - name: include
          in: query
          description: |
            `body` adds the parsed and raw payloads. The rule editor uses it to
            build condition paths from a real request; the plain list stays lean.
          schema:
            type: string
            enum: [body]
        - name: after
          in: query
          description: |
            Cursor for the live feed: return only deliveries with a greater id,
            oldest first. A page offset cannot express "what arrived since I last
            looked" — on a busy room the window shifts between two requests and the
            tail either skips rows or returns them twice. `after=0` is the ordinary
            paged list, newest first, so a client with no cursor yet reloads instead
            of prepending history in the wrong order.
          schema:
            type: integer
            minimum: 0
            default: 0
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: |
            A page of requests, or — with `after` — the rows newer than that id.
            A cursor answer carries `meta.cursor` and `meta.has_more` and no page
            counters, because it is a window, not a page of history.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RequestSummary'
                  meta:
                    oneOf:
                      - $ref: '#/components/schemas/Pagination'
                      - $ref: '#/components/schemas/CursorPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/requests/export:
    get:
      tags: [Requests]
      summary: Download the filtered log
      description: |
        Uses the same filters as the list, so a download matches the screen. The
        response is a file (`Content-Disposition: attachment`), which is why the
        SPA fetches it as a blob instead of using a link — the API needs a Bearer
        header a navigation cannot send.

        CSV is `;`-separated with a UTF-8 BOM (Excel in a Russian locale).
      parameters:
        - $ref: '#/components/parameters/RoomSlug'
        - name: method
          in: query
          schema:
            type: string
        - name: endpoint
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
        - name: format
          in: query
          schema:
            type: string
            enum: [json, ndjson, csv]
            default: json
      responses:
        '200':
          description: The export.
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="hookdock-stripe-20260101-120000.json"
          content:
            application/json:
              schema:
                type: object
                properties:
                  exported_at:
                    type: string
                    format: date-time
                  requests:
                    type: array
                    items:
                      $ref: '#/components/schemas/RequestSummary'
            application/x-ndjson:
              schema:
                type: string
            text/csv:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Invalid'

  /api/requests/{id}:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Requests]
      summary: One request with its runs and step logs
      responses:
        '200':
          description: The stored request and everything routing decided.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      request:
                        $ref: '#/components/schemas/RequestFull'
                      runs:
                        type: array
                        items:
                          $ref: '#/components/schemas/RunWithSteps'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Requests]
      summary: Delete a request and its runs
      responses:
        '200':
          description: Deleted, or already gone.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  deleted:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ReadOnly'

  /api/requests/{id}/body:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Requests]
      summary: Download the stored body as a file
      description: |
        Returns `raw_body` byte for byte — the original text, including a
        non-JSON payload. A 4 MB webhook belongs in an editor, not in a copy-paste
        field. The filename carries the request id and the extension follows the
        stored `Content-Type`.
      responses:
        '200':
          description: The payload.
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="request-42.json"
          content:
            application/json:
              schema:
                type: string
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/requests/{id}/replay:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Requests]
      summary: Route a stored request again
      description: |
        Queues the room's matching workflows again for the stored row. No new
        `incoming_requests` row is created, so the log keeps one entry per
        delivery. Used when a rule was paused, wrong, or added after the webhook
        arrived.
      responses:
        '202':
          description: Runs queued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      queued:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ReadOnly'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/requests/bulk:
    post:
      tags: [Requests]
      summary: Delete or replay several requests at once
      description: |
        Takes an **explicit id list**, never the current filter: "delete
        everything matching this search" turns one mis-click into an outage, and
        the log has no undo. The client sends what the operator could see and had
        selected; `ids` is capped at 200, so a script cannot turn one call into a
        table-wide delete.

        A request whose run is still `pending`/`running` is **skipped** and
        reported with a reason instead of being deleted — removing it would cancel
        routing that is being done right now. Ids that no longer exist are
        reported in `missing` rather than failing the whole batch.

        The journal gets one entry per call (`request.bulk_deleted` /
        `request.bulk_replayed`), because a hundred rows would bury every other
        change in the feed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, ids]
              properties:
                action:
                  type: string
                  enum: [delete, replay]
                ids:
                  type: array
                  maxItems: 200
                  items:
                    type: integer
            examples:
              replay:
                value:
                  action: replay
                  ids: [1201, 1202, 1203]
              delete:
                value:
                  action: delete
                  ids: [1201]
      responses:
        '200':
          description: The batch report.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      action:
                        type: string
                        enum: [delete, replay]
                      count:
                        type: integer
                        description: Rows actually deleted or replayed.
                      queued:
                        type: integer
                        description: Runs queued (zero for `delete`).
                      skipped:
                        type: array
                        description: Rows left alone, with the reason.
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            reason:
                              type: string
                              example: Запуск ещё выполняется
                      missing:
                        type: array
                        description: Ids that were not found.
                        items:
                          type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ReadOnly'
        '422':
          $ref: '#/components/responses/Invalid'

  /api/requests/{id}/redeliver:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Requests]
      summary: Route a corrected copy of a stored request
      description: |
        The counterpart of `replay`: that one re-routes the payload that is
        stored, which is useless when the **payload** was wrong. This stores a
        new row with the corrections and routes it, so the whole pipeline
        (conditions, templates, dry run, step log) works unchanged.

        The original row is never mutated: the log is the evidence of what the
        sender actually sent, and a run's step log must not describe a payload
        that never arrived. The copy carries `replayed_from` instead of
        `duplicate_of`, because the latter means "the sender retried and we
        deliberately did not route it" — the opposite of what happened here. No
        `dedup_key` is set on the copy either, or the room's deduplication rule
        would make the redelivery a duplicate of itself and never route it.

        Omitted fields are inherited from the original; headers are merged over
        the stored ones rather than replaced.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  description: |
                    Structured body. Sent as JSON, so `raw_body` and the `jsonb`
                    column cannot disagree. Takes precedence over `raw_body`.
                  oneOf:
                    - type: object
                    - type: array
                raw_body:
                  type: string
                  description: Verbatim body, for a non-JSON delivery.
                method:
                  type: string
                  example: POST
                path:
                  type: string
                endpoint:
                  type: string
                  description: Defaults to the original endpoint.
                query:
                  type: object
                  additionalProperties: true
                headers:
                  type: object
                  additionalProperties:
                    type: string
                content_type:
                  type: string
            examples:
              correctedJson:
                value:
                  body:
                    type: payment
                    amount: 99
      responses:
        '202':
          description: The copy is stored and queued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: Id of the new row.
                      replayed_from:
                        type: integer
                        description: Id of the original request.
                      received_at:
                        type: string
                        format: date-time
                      queued:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ReadOnly'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'

  /api/requests/{id}/preview:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Requests]
      summary: Dry run — what would routing do
      description: |
        Evaluates conditions against the stored payload and *describes* each
        action (URL, method, headers, body, signature verdict). Nothing is queued
        and nothing leaves the process.

        * Empty body → every enabled rule of the room is evaluated (`mode: room`),
          which is the question the request card asks.
        * `workflow_id` → only that rule (`mode: workflow`).
        * `{conditions, actions}` → an unsaved draft from the editor
          (`mode: draft`).

        A `forward` still passes `UrlGuard`: a preview that approves a target the
        worker will refuse would be worse than no preview at all, so each forward
        step carries `allowed` and, when refused, `reason`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                workflow_id:
                  type: integer
                conditions:
                  $ref: '#/components/schemas/ConditionTree'
                actions:
                  type: array
                  items:
                    $ref: '#/components/schemas/Action'
            examples:
              draft:
                summary: An unsaved rule from the editor
                value:
                  conditions:
                    mode: all
                    rules:
                      - path: body.event.type
                        operator: equals
                        value: payment
                  actions:
                    - type: log
                      message: 'paid by {{ body.customer.name }}'
              room:
                summary: Every enabled rule of the room
                value: {}
      responses:
        '200':
          description: What the rules would do.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      request_id:
                        type: integer
                      mode:
                        type: string
                        enum: [draft, workflow, room]
                      workflows:
                        type: array
                        items:
                          type: object
                          properties:
                            workflow_id:
                              type: integer
                              nullable: true
                            name:
                              type: string
                            priority:
                              type: integer
                            matched:
                              type: boolean
                            steps:
                              type: array
                              items:
                                type: object
                                additionalProperties: true
                                description: |
                                  One described action. A `forward` step also
                                  carries `allowed`/`reason` from `UrlGuard` and
                                  `breaker`/`breaker_retry_in` from the
                                  per-address circuit breaker: describing a
                                  request the worker would skip right now would
                                  be worse than describing nothing.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'

  /api/runs:
    get:
      tags: [Runs]
      summary: The run journal
      description: |
        Answers "what failed in the last hour" without opening stored requests one
        by one — the request is context, the run is the subject. Read-only; a
        retry stays on `POST /api/runs/{id}/retry`.
      parameters:
        - $ref: '#/components/parameters/RoomSlug'
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, running, success, failed, skipped, all]
        - name: workflow_id
          in: query
          schema:
            type: integer
        - name: q
          in: query
          description: Substring of the run message, the workflow name or the request path.
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: A page of runs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RunRow'
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/Pagination'
                      - type: object
                        properties:
                          statuses:
                            type: array
                            items:
                              type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'

  /api/runs/{id}/retry:
    parameters:
      - name: id
        in: path
        required: true
        description: The run to repeat.
        schema:
          type: integer
    post:
      tags: [Runs]
      summary: Repeat a finished run
      description: |
        Inserts a **new** run for the same workflow and request instead of
        resetting the failed one. Resetting would make the engine skip the actions
        that already succeeded, so «Повторить» would silently not repeat them; the
        failed row keeps its attempts and step log as evidence.
      responses:
        '202':
          description: A fresh run is queued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      request_id:
                        type: integer
                      queued:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ReadOnly'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'

  /api/workflows:
    get:
      tags: [Workflows]
      summary: List rules
      description: |
        Conditions come back as a normalized tree plus `condition_count` (leaves,
        not groups). Ordered by `priority` descending, then newest first — the same
        order the engine uses. `auto_paused` is derived (`!enabled &&
        disabled_reason`), so an automatic pause stays distinguishable from a
        manual one.
      parameters:
        - $ref: '#/components/parameters/RoomSlug'
      responses:
        '200':
          description: Rules, newest first within a priority.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Workflow'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Workflows]
      summary: Create a rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowInput'
            examples:
              orGroup:
                summary: type = payment AND (name = Ada OR name = Bob)
                value:
                  room: stripe
                  name: Paid by Ada or Bob
                  endpoint: payments
                  enabled: true
                  priority: 100
                  stop_processing: true
                  conditions:
                    mode: all
                    rules:
                      - path: body.event.type
                        operator: equals
                        value: payment
                      - mode: any
                        rules:
                          - path: body.customer.name
                            operator: equals
                            value: Ada
                          - path: body.customer.name
                            operator: equals
                            value: Bob
                  actions:
                    - type: forward
                      url: https://example.com/hooks/paid
                      method: POST
                      payload: body
                      headers:
                        X-Event: '{{ body.event.type }}'
                      secret: shared-hmac-secret
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Workflow'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ReadOnly'
        '422':
          $ref: '#/components/responses/Invalid'

  /api/workflows/{id}:
    parameters:
      - $ref: '#/components/parameters/WorkflowId'
    get:
      tags: [Workflows]
      summary: Read one rule
      responses:
        '200':
          description: The rule.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Workflow'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Workflows]
      summary: Edit a rule
      description: |
        The room cannot change (`422`): moving a rule would silently change which
        webhooks fire.

        Saving with `enabled: true` is also the operator saying "this is fixed", so
        the failure streak and the automatic-pause note are cleared.

        **Signing a forward.** The stored secret is never returned; reads expose
        `signed: true` instead. Because the editor cannot send back a value it
        never saw, an action with an empty `secret` **keeps** the stored one — an
        edit of the name must not silently unsign the forward. Clearing it is the
        explicit `clear_signature: true`. The old secret is carried over only when
        the action sits at the same index **and** has the same URL, so reordering
        forwards cannot move one target's secret onto another.

        **Stale saves are refused.** `actions_version` is the version of the
        action list the editor loaded. If it differs from the stored one, the save
        is rejected with `409` and the current version in
        `error.actions_version` — the other tab's change is not discarded
        silently. A client that omits the field (curl, an older script) keeps
        working: requiring it would break every existing integration for a
        protection it never asked for. The counter only grows when the actions
        actually change, so renaming a rule does not invalidate another tab's
        draft.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowInput'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Workflow'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ReadOnly'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'
    delete:
      tags: [Workflows]
      summary: Delete a rule
      responses:
        '200':
          description: Deleted, or already gone.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  deleted:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ReadOnly'

  /api/workflows/{id}/toggle:
    parameters:
      - $ref: '#/components/parameters/WorkflowId'
    post:
      tags: [Workflows]
      summary: Pause or resume a rule
      description: |
        Toggling clears `disabled_reason`, the streak and the automatic-pause note:
        either state here is the operator's own decision, not a failure.
      responses:
        '200':
          description: The new state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      enabled:
                        type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ReadOnly'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/workflows/{id}/duplicate:
    parameters:
      - $ref: '#/components/parameters/WorkflowId'
    post:
      tags: [Workflows]
      summary: Copy a rule
      description: |
        The copy lands in the same room, keeps conditions, actions, `priority` and
        `stop_processing`, and is named «… (копия)». It is created **paused**, so a
        copy cannot double every forward while it is being edited. Runs and steps
        are not copied — the new rule has no history yet.
      responses:
        '201':
          description: The copy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Workflow'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ReadOnly'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/workflows/{id}/run:
    parameters:
      - $ref: '#/components/parameters/WorkflowId'
    post:
      tags: [Workflows]
      summary: Run a rule once, now
      description: |
        Queues one run immediately instead of waiting for a delivery or a cron slot.
        This is how a scheduled rule is tested without waiting for its next slot,
        and how a webhook rule is exercised while its source is still silent.

        The run has **no request**: `request_id` is `null` and the payload is empty,
        exactly what a scheduled fire sees. Conditions are therefore not evaluated —
        a rule whose conditions would not match still runs, because there is nothing
        to match them against.

        `schedule_next_at` is **not** touched: a test must not move the real
        schedule. A paused rule can still be run — the operator is asking whether it
        works, and refusing would make them unpause a rule that is paused for a
        reason. The answer is `202`; the worker does the work and publishes
        `run.updated`.
      responses:
        '202':
          description: The queued run.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: The new `workflow_runs.id`.
                      workflow_id:
                        type: integer
                      request_id:
                        type: integer
                        nullable: true
                        description: Always `null` here.
                      queued:
                        type: integer
                        description: Always `1`.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ReadOnly'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/workflows/{id}/versions:
    parameters:
      - $ref: '#/components/parameters/WorkflowId'
    get:
      tags: [Workflows]
      summary: Saved configurations of a rule
      description: |
        `actions_version` protects two editors from each other; it says nothing to
        the operator who saved a wrong rule yesterday. Every save therefore stores
        the whole configuration as a version here, newest first (the list returns the
        newest 100; the rows themselves are kept, so a rollback target is never
        destroyed by housekeeping).

        Readable by every role: seeing what changed is the reason the history is
        kept. A version is stored with its signature secrets intact — otherwise a
        restore would silently start sending unsigned requests — but reads pass
        through the same `redactActions()` as reads of the rule, so the value still
        never leaves the API.
      responses:
        '200':
          description: Versions of this rule.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkflowVersion'
                  meta:
                    type: object
                    properties:
                      workflow_id:
                        type: integer
                      current_version:
                        type: integer
                        description: The newest stored version, or `0` for none.
                      actions_version:
                        type: integer
                        description: The lock value the rule currently carries.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/workflows/{id}/versions/{version}:
    parameters:
      - $ref: '#/components/parameters/WorkflowId'
      - $ref: '#/components/parameters/WorkflowVersion'
    get:
      tags: [Workflows]
      summary: One saved configuration
      responses:
        '200':
          description: The snapshot, as it would be restored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/WorkflowVersionSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/workflows/{id}/versions/{version}/restore:
    parameters:
      - $ref: '#/components/parameters/WorkflowId'
      - $ref: '#/components/parameters/WorkflowVersion'
    post:
      tags: [Workflows]
      summary: Roll a rule back to a saved configuration
      description: |
        A rollback is a **new save**, not a rewrite of history: the current state is
        snapshotted first (so the rollback itself can be undone), and the restored
        configuration becomes the newest version. Deleting the versions in between
        would make "who put this back and when" unanswerable, which is the reason
        the history exists.

        `actions_version` follows the same rule as a normal save — it only grows
        when the action list actually differs, so restoring a version that changed
        only a name does not invalidate another tab's draft. Restoring an enabled
        rule also clears the failure streak, because that is the operator saying
        "this should work".
      responses:
        '200':
          description: The rule after the rollback.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Workflow'
                  meta:
                    type: object
                    properties:
                      restored_from:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ReadOnly'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/breakers:
    get:
      tags: [Delivery]
      summary: Forward targets the breaker is skipping
      description: |
        State per **address** (`scheme://host:port`), not per rule: two scenarios
        forwarding to the same endpoint share one verdict, and fixing the endpoint
        fixes both. Installation-wide, not room-scoped, because the target is.

        `state` is derived from `next_probe_at`, so nothing has to run in the
        background for an address to recover: the first delivery after the
        cooldown is the probe, and its outcome either closes the breaker or
        re-opens it. `retry_in` is the number of seconds left before that probe.
      responses:
        '200':
          description: Breaker rows, broken ones first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ForwardTarget'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/breakers/reset:
    post:
      tags: [Delivery]
      summary: Try an address again now
      description: |
        The operator says "I fixed it". The row is **deleted**, not flipped to
        `closed`: a stale failure count would re-open the breaker on the very next
        error and the reset would look like it did nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address]
              properties:
                address:
                  type: string
                  example: https://down.example.com:443
      responses:
        '200':
          description: The address is clear.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  reset:
                    type: boolean
                    description: '`false` when the address had no breaker row.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ReadOnly'
        '422':
          $ref: '#/components/responses/Invalid'

  /api/rooms/{id}/workflows/export:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      tags: [Workflows]
      summary: A room's rules as a file
      description: |
        A portable document of the room's scenarios — conditions, actions,
        priorities and flags — so a router built in staging does not have to be
        rebuilt in production by hand.

        Signature secrets are **not** exported, and not because of an oversight:
        an HMAC cannot be verified against a hash, so the value is stored as-is
        and never leaves the API. A forward with a secret comes back as
        `signed: true`; the import counts those and reports them, instead of
        producing a rule that looks right and sends unsigned requests.

        The `room` block is informational. The import ignores it: applying
        delivery settings while importing rules would change how the receiving
        room accepts traffic without saying so.
      responses:
        '200':
          description: The document, as a download.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomDocument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/rooms/{id}/workflows/import:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    post:
      tags: [Workflows]
      summary: Create rules from an exported document
      description: |
        All or nothing: a half-imported rule set is worse than a refused one,
        because the operator cannot tell which half is missing. Every rule goes
        through the same validation as the editor, so a file cannot introduce a
        condition tree or an action the UI could not have made.

        `room_id` comes from the URL, never from the document — a staging export
        cannot write into production by accident. Nothing is deleted or
        overwritten: a colliding name gets a numeric suffix, because importing the
        same file twice is a normal way to check that nothing broke.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomDocument'
      responses:
        '201':
          description: Rules created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      created:
                        type: integer
                      workflows:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                      secrets_not_imported:
                        type: integer
                        description: |
                          Forwards whose document said `signed: true`. Not an
                          error — a secret cannot travel in a file — but the
                          operator has to know that those rules send unsigned
                          requests until the secret is entered again.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ReadOnly'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'

  /hook/{room}/{endpoint}:
    post:
      tags: [Ingest]
      summary: Capture a webhook in a room
      description: |
        Public. Any method, any content type, and the endpoint may carry its own
        path (`/hook/{room}/{endpoint}/a/b/c`).

        The response is `202` **before** any action runs: the catcher stores the
        request and queues one `pending` run per matching rule. A slow forward
        target can therefore never hold the sender, and a failed action cannot
        change an already-sent `202`.

        A room with a secret requires `X-Hookdock-Signature: sha256=<hex>` where
        the digest is `HMAC-SHA256(raw_body, secret)`. The check happens **before**
        the `INSERT`, so a forged request is neither stored nor queued. A bare hex
        digest without the prefix is accepted too, because some senders strip it.

        With `require_timestamp`, the room also requires
        `X-Hookdock-Timestamp: <unix seconds>` and the digest covers
        `"<ts>.<raw_body>"`; a timestamp outside `SIGNATURE_TOLERANCE_SECONDS`
        (300 by default) is refused with `401`. When the timestamp header is
        present but the room does not require it, the timestamped form is used
        anyway — a body-only signature next to a timestamp would make the
        timestamp decorative.

        With `dedup_header` set, the header's value is the delivery id. The first
        delivery stores it; a repeat is stored with `duplicate_of` and answered
        with `202 {duplicate: true, queued: 0}`, so the sender sees success and no
        action runs twice. A missing header is not an error — the delivery is
        handled like any other.
      security: []
      parameters:
        - $ref: '#/components/parameters/RoomSlugPath'
        - name: endpoint
          in: path
          required: true
          description: Free-form slug; `*` rules match every endpoint of the room.
          schema:
            type: string
        - name: X-Hookdock-Signature
          in: header
          required: false
          description: Required only when the room has a secret.
          schema:
            type: string
            example: sha256=9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
        - name: X-Hookdock-Timestamp
          in: header
          required: false
          description: |
            Unix seconds. Required when the room sets `require_timestamp`; the
            signature then covers `"<timestamp>.<body>"`.
          schema:
            type: string
            example: '1735689600'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
          text/plain:
            schema:
              type: string
          multipart/form-data:
            schema:
              type: object
              additionalProperties: true
      responses:
        '202':
          description: Stored and queued. `queued` counts the runs, not the requests.
          content:
            application/json:
              schema:
                type: object
                required: [ok, id, room, endpoint, received_at, queued]
                properties:
                  ok:
                    type: boolean
                    example: true
                  id:
                    type: integer
                    example: 42
                  room:
                    type: string
                    example: stripe
                  endpoint:
                    type: string
                    example: payments
                  received_at:
                    type: string
                    format: date-time
                  queued:
                    type: integer
                    description: How many rule runs were queued. `0` for a duplicate.
                    example: 2
                  duplicate:
                    type: boolean
                    description: |
                      `true` when the delivery repeated a known `dedup_header`
                      value. The row is stored, nothing is queued, and the answer
                      is still `202` — a different status would make the sender
                      retry the delivery it was told to stop sending.
                  duplicate_of:
                    type: integer
                    nullable: true
                    description: The original request id for a duplicate, otherwise `null`.
        '401':
          description: |
            The room requires a signature and none (or a wrong one) was sent, or
            the timestamp is missing/stale where the room requires one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /hook/{room}:
    post:
      tags: [Ingest]
      summary: Capture a webhook in a room without naming an endpoint
      description: |
        Stores the request with `endpoint = "default"`. `/hook/{x}` is ambiguous
        (room vs endpoint): a known room slug wins, otherwise the segment is
        treated as an endpoint of the room `default`. An unknown room in a
        two-segment URL is a `404` — never auto-created, never a fallback.
      security: []
      parameters:
        - $ref: '#/components/parameters/RoomSlugPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '202':
          description: Stored and queued.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    RoomId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    RoomSlugPath:
      name: room
      in: path
      required: true
      description: Room slug (`/hook/{room}/...`).
      schema:
        type: string
        example: stripe
    RoomSlug:
      name: room
      in: query
      required: false
      description: |
        Room slug. Omitted = installation-wide. An unknown slug is a `404`, not an
        empty list.
      schema:
        type: string
        example: stripe
    RequestId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    WorkflowId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    WorkflowVersion:
      name: version
      in: path
      required: true
      description: The `version` number from the history list.
      schema:
        type: integer
        minimum: 1
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25

  responses:
    Unauthorized:
      description: Missing or invalid token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              message: Требуется авторизация
    ReadOnly:
      description: |
        The write was refused: the token has `scope: read`, or the account's role
        is `viewer`. A role and a scope are separate limits and both are checked,
        so either one is enough.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              message: 'Токен только для чтения: изменение данных недоступно'
    AdminOnly:
      description: |
        The operation needs the `admin` role — managing accounts, granting roles.
        Editors are refused too, because an editor who could grant themselves
        `admin` would make the roles decorative.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              message: 'Нужна роль «администратор»'
    NotFound:
      description: No such record, or an unknown room slug.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              message: Запрос не найден
    Invalid:
      description: The payload was rejected.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              message: Условия вложены слишком глубоко (максимум 5)
    Conflict:
      description: |
        The rule was edited elsewhere since this editor loaded it — the stored
        `actions_version` is newer than the one the client sent.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - type: object
                properties:
                  error:
                    type: object
                    properties:
                      actions_version:
                        type: integer
                        description: The version currently stored; re-read the rule.
          example:
            error:
              message: 'Сценарий изменён в другой вкладке (версия действий 4). Перезагрузите его, чтобы не потерять чужие правки'
              actions_version: 4
    TooManyRequests:
      description: Rate limited.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message]
          properties:
            message:
              type: string

    Pagination:
      type: object
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        pages:
          type: integer

    CursorPage:
      type: object
      description: |
        The answer to `?after=<id>`. `cursor` is the newest id returned (unchanged
        when nothing was), which is what the next pull sends as `after`. `has_more`
        means "ask again straight away": a burst can exceed one page.
      properties:
        per_page:
          type: integer
        cursor:
          type: integer
        has_more:
          type: boolean
        mode:
          type: string
          enum: [after]

    Health:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
        time:
          type: string
          format: date-time
        checks:
          type: object
          properties:
            database:
              type: object
              properties:
                status:
                  type: string
                  enum: [ok, fail]
                message:
                  type: string
            queue:
              type: object
              properties:
                status:
                  type: string
                  enum: [ok, fail]
                pending:
                  type: integer
                running:
                  type: integer
                oldest_pending_seconds:
                  type: integer
                max_age_seconds:
                  type: integer
            worker:
              type: object
              properties:
                status:
                  type: string
                  enum: [ok, fail]
                workers:
                  type: integer
                last_beat_at:
                  type: string
                  format: date-time
                  nullable: true
                stale_after_seconds:
                  type: integer

    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        scope:
          type: string
          enum: [api, read]
          description: |
            What the presented credential may do. A `read` token refuses every
            mutating endpoint regardless of the role.
        can_write:
          type: boolean
          description: |
            Role and scope folded into the one question the UI asks. A convenience:
            the API enforces the same rule, so hiding a button is never what
            protects the data.
        can_admin:
          type: boolean

    Role:
      type: string
      enum: [admin, editor, viewer]
      description: |
        - `admin` — everything, including accounts, roles and the audit log.
        - `editor` — the product: rooms, rules, replay, retry, breakers.
        - `viewer` — reads, exports, previews and the run journal only.

        Enforced on the server, not only in the UI. The default for an existing
        row is `admin`, so an upgrade cannot lock the operator out of the page that
        grants roles.

    Account:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: string
          format: date-time
          nullable: true

    AuditEntry:
      type: object
      description: |
        One line of the journal. Denormalized on purpose: `actor_email`,
        `room_slug` and `object_label` are copies, so an entry stays readable after
        the account was renamed and the room was deleted.
      properties:
        id:
          type: integer
        created_at:
          type: string
          format: date-time
        actor_id:
          type: integer
          nullable: true
        actor_email:
          type: string
        actor_role:
          type: string
        action:
          type: string
          example: workflow.updated
        object_type:
          type: string
          example: workflow
        object_id:
          type: integer
          nullable: true
        object_label:
          type: string
          description: The name the object had at the time, or `#<id>`.
        room_id:
          type: integer
          nullable: true
          description: |
            `null` for an entry that is not room-scoped, and for a room that has
            since been deleted (`ON DELETE SET NULL`).
        room_slug:
          type: string
          nullable: true
        summary:
          type: string
          description: A sentence for the feed, already localized.
        changes:
          type: object
          nullable: true
          additionalProperties: true
          description: |
            `{field: [before, after]}`. A small nested value (a condition tree) is
            kept verbatim so the entry can say *what* changed; a large one is
            summarized as `{count}`. Over 4 KB the whole diff becomes
            `{"_truncated": "<n> bytes"}`. Secrets are removed before the diff is
            built.
        ip:
          type: string
          nullable: true

    WorkflowVersion:
      type: object
      description: |
        One saved configuration of a rule, as listed in the history.
      properties:
        id:
          type: integer
        version:
          type: integer
        actions_version:
          type: integer
        name:
          type: string
        endpoint:
          type: string
        enabled:
          type: boolean
        priority:
          type: integer
        stop_processing:
          type: boolean
        schedule_cron:
          type: string
          nullable: true
          description: |
            The trigger of that version. A rollback restores it, so restoring an
            older snapshot cannot silently turn a scheduled rule back into a
            webhook one; the next slot is then computed from now.
        actor_email:
          type: string
          description: Empty for a baseline row or a change made by a script.
        change:
          type: string
          enum: [baseline, created, update, toggle, import, rollback]
          description: |
            `baseline` is the snapshot migration `013` wrote for rules that existed
            before history did; `rollback` is a restore, which is a new version
            rather than a rewrite.
        created_at:
          type: string
          format: date-time

    WorkflowVersionSnapshot:
      allOf:
        - $ref: '#/components/schemas/WorkflowVersion'
        - type: object
          properties:
            workflow_id:
              type: integer
            room_id:
              type: integer
            conditions:
              $ref: '#/components/schemas/ConditionTree'
            actions:
              type: array
              items:
                $ref: '#/components/schemas/Action'
              description: |
                Redacted like any other read — a signed forward reads
                `signed: true`, never the secret. The stored snapshot keeps it, so
                a restore still signs.

    Room:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        endpoint:
          type: string
        has_secret:
          type: boolean
          description: Whether the room requires an HMAC signature. The secret itself is never returned.
        dedup_header:
          type: string
          nullable: true
          description: |
            Header whose value identifies a delivery (`X-GitHub-Delivery`,
            `Stripe-Event-Id`, …). `null` means deduplication is off. A repeat of
            a known value is stored with `duplicate_of` set and is never routed.
          example: X-GitHub-Delivery
        require_timestamp:
          type: boolean
          description: |
            Requires `X-Hookdock-Timestamp` and a signature over `"<ts>.<body>"`.
            Only has an effect together with a secret.
        ip_allowlist:
          type: array
          description: |
            Sender ranges allowed to deliver to this room, as canonical CIDRs
            (`203.0.113.0/24`, `2001:db8::/32`); a bare address is stored as
            `/32` or `/128`. Match is on packed bytes, so `::1` and
            `::ffff:127.0.0.1` are the same sender.

            An **empty list accepts everyone** — that is what every room did
            before the setting existed, and an upgrade must not stop the
            installation's integrations. A non-empty list refuses any address
            outside it with `403` **before** the row is stored, so a refused
            delivery is neither logged nor routed.
          items:
            type: string
          maxItems: 64
          default: []
          example: ['203.0.113.0/24']
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ApiToken:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        user_email:
          type: string
          description: Present on the list; the owner of the key.
        name:
          type: string
        prefix:
          type: string
          description: |
            The lookup half of the token. Not a secret: it is what the request
            finds its row by, and it is what the list shows so two keys can be
            told apart.
          example: hd_e855cf57688d
        scope:
          type: string
          enum: [api, read]
        revoked:
          type: boolean
        expired:
          type: boolean
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: '`null` means the key does not expire.'
        last_used_at:
          type: string
          format: date-time
          nullable: true
          description: Written at most once a minute, so it answers "used recently", not "used at 12:00:03".
        revoked_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    RoomCounters:
      allOf:
        - $ref: '#/components/schemas/Room'
        - type: object
          properties:
            requests_total:
              type: integer
            requests_last_24h:
              type: integer
            last_received_at:
              type: string
              format: date-time
              nullable: true
            workflows_active:
              type: integer
            workflows_total:
              type: integer
            failed_runs_24h:
              type: integer

    RequestSummary:
      type: object
      properties:
        id:
          type: integer
        room_id:
          type: integer
        endpoint:
          type: string
        method:
          type: string
        path:
          type: string
        content_type:
          type: string
          nullable: true
        body_bytes:
          type: integer
        ip:
          type: string
          nullable: true
        received_at:
          type: string
          format: date-time
        run_count:
          type: integer
        failed_runs:
          type: integer
        pending_runs:
          type: integer
        duplicate_of:
          type: integer
          nullable: true
          description: |
            Set when this delivery repeated a `dedup_header` value already seen in
            the room. Such a row is stored for the audit log but never queued.
        replayed_from:
          type: integer
          nullable: true
          description: |
            Set when a human sent this row as a corrected copy of another request
            (`POST /api/requests/{id}/redeliver`). Unlike `duplicate_of` this row
            **is** routed: it is a real delivery, just not one the sender made.
        body:
          description: Present only with `?include=body`. NULL for a non-JSON payload.
          nullable: true
        raw_body:
          type: string
          nullable: true

    RequestFull:
      allOf:
        - $ref: '#/components/schemas/RequestSummary'
        - type: object
          properties:
            query:
              type: object
              additionalProperties: true
            headers:
              type: object
              additionalProperties: true

    RunRow:
      type: object
      properties:
        id:
          type: integer
        workflow_id:
          type: integer
        request_id:
          type: integer
          nullable: true
          description: |
            NULL for a run the rule started by itself — a cron slot or
            «Запустить сейчас». Such a run has no stored delivery behind it, so
            `method`/`path`/`endpoint` are empty too.
        trigger_type:
          type: string
          enum: [webhook, schedule, manual]
          description: What started the run. `webhook` is a delivery, `schedule` a cron slot.
        status:
          type: string
          enum: [pending, running, success, failed, skipped]
        message:
          type: string
          nullable: true
          description: Human-readable outcome, in Russian.
        attempts:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        available_at:
          type: string
          format: date-time
          description: When the run may be claimed (a `delay` action moves this forward).
        workflow_name:
          type: string
        priority:
          type: integer
        room_id:
          type: integer
        method:
          type: string
          nullable: true
        path:
          type: string
          nullable: true
        endpoint:
          type: string
          nullable: true
        steps:
          type: integer

    RunWithSteps:
      allOf:
        - $ref: '#/components/schemas/RunRow'
        - type: object
          properties:
            steps:
              type: array
              items:
                $ref: '#/components/schemas/RunStep'

    RunStep:
      type: object
      properties:
        id:
          type: integer
        run_id:
          type: integer
        attempt:
          type: integer
        action_index:
          type: integer
        type:
          type: string
          enum: [forward, log, transform, delay]
        status:
          type: string
          enum: [success, failed]
        message:
          type: string
          nullable: true
        response_status:
          type: integer
          nullable: true
        response_body:
          type: string
          nullable: true
        duration_ms:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time

    Condition:
      type: object
      required: [path, operator]
      properties:
        path:
          type: string
          description: |
            Dot path into the request context: `body.customer.email`,
            `query.source`, `headers.x-github-event`, `meta.method`,
            `transformed.*`.
          example: body.event.type
        operator:
          type: string
          enum: [equals, not_equals, contains, not_contains, exists, not_exists, gt, gte, lt, lte, regex]
        value:
          description: Compared against the resolved value. Ignored by `exists`/`not_exists`.

    ConditionTree:
      type: object
      description: |
        A group of conditions. `mode: all` requires every rule, `mode: any` one of
        them; a rule may itself be a group, so
        `type = payment AND (name = Ada OR name = Bob)` is directly expressible.
        Depth ≤ 5, at most 40 leaves. A flat list is accepted and read as
        `{mode: all, rules: [...]}`.
      required: [mode, rules]
      properties:
        mode:
          type: string
          enum: [all, any]
        rules:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/Condition'
              - $ref: '#/components/schemas/ConditionTree'

    Action:
      type: object
      description: |
        One of four action types, discriminated by `type`. Executed in order.

        * `forward` — HTTP call. `payload` is `body`, `transformed`, `raw` or a
          template string / JSON object. `secret` signs the outgoing body
          (`X-Hookdock-Signature`) and is never returned.
        * `transform` — maps result keys to context paths, feeding a later
          `payload: transformed`.
        * `delay` — pauses 1–86400 seconds, then continues. The pause belongs to
          the run, not the sender; it does not consume a retry, and a resumed run
          does not wait again.
        * `log` — records a message rendered from `{{ body.field }}` templates.
      required: [type]
      properties:
        type:
          type: string
          enum: [forward, log, transform, delay]
        url:
          type: string
          format: uri
          description: '`forward` only. Must be http/https and pass the SSRF guard.'
        method:
          type: string
          enum: [POST, PUT, PATCH, GET, DELETE]
          default: POST
        payload:
          description: '`forward` only.'
          oneOf:
            - type: string
              enum: [body, transformed, raw]
            - type: object
              additionalProperties: true
        headers:
          type: object
          additionalProperties:
            type: string
        secret:
          type: string
          writeOnly: true
          description: |
            `forward` only. Empty means "keep the stored secret"; removing it is
            `clear_signature: true`.
        clear_signature:
          type: boolean
          writeOnly: true
        signed:
          type: boolean
          readOnly: true
          description: Present on read when the stored forward carries a secret.
        sign_timestamp:
          type: boolean
          default: false
          description: |
            `forward` only. When set, the outgoing signature carries
            `X-Hookdock-Timestamp` and covers `"<ts>.<body>"`. Off by default: a
            recipient that verifies a body-only HMAC would reject the new form.
        timeout:
          type: integer
          minimum: 1
          maximum: 60
          description: |
            `forward` only. Seconds for this request. Omitted means the global
            `FORWARD_TIMEOUT`, which is why the key is not stored as `0`.
        mapping:
          type: object
          additionalProperties:
            type: string
          description: '`transform` only: result key → context path.'
        seconds:
          type: integer
          minimum: 1
          maximum: 86400
          description: '`delay` only.'
        message:
          type: string
          description: '`log` only. Supports `{{ body.field }}`.'

    Analytics:
      type: object
      description: |
        Throughput and latency for one window. Every number is scoped by `room`
        when it is given; without it the totals are installation-wide.
      properties:
        window_hours:
          type: integer
          example: 24
        since:
          type: string
          format: date-time
          description: Start of the window (UTC); the inside of the oldest bucket.
        generated_at:
          type: string
          format: date-time
        requests:
          type: object
          properties:
            total:
              type: integer
            per_hour:
              type: number
              description: Mean deliveries per hour over the window.
            duplicates:
              type: integer
              description: Repeat deliveries stored but not routed.
            replayed:
              type: integer
              description: Copies an operator sent with corrections.
            bytes:
              type: integer
              description: Sum of the stored bodies.
            by_method:
              type: array
              items:
                type: object
                properties:
                  method:
                    type: string
                  total:
                    type: integer
            top_endpoints:
              type: array
              description: The 10 most frequent paths in the window.
              items:
                type: object
                properties:
                  endpoint:
                    type: string
                  total:
                    type: integer
        runs:
          type: object
          properties:
            total:
              type: integer
              description: Includes runs still `pending` or `running`.
            success_rate:
              type: number
              nullable: true
              description: |
                `success` over **finished** runs. `null` when nothing finished in
                the window — a queued backlog must not read as a failure rate.
              example: 0.9375
            by_status:
              type: object
              properties:
                pending:
                  type: integer
                running:
                  type: integer
                success:
                  type: integer
                failed:
                  type: integer
                skipped:
                  type: integer
        actions:
          type: object
          description: Per action type, from `workflow_run_steps`.
          properties:
            total:
              type: integer
            by_type:
              type: array
              items:
                type: object
                properties:
                  type:
                    type: string
                    example: forward
                  total:
                    type: integer
                  failed:
                    type: integer
                  skipped:
                    type: integer
                  p50_ms:
                    type: integer
                  p95_ms:
                    type: integer
                  max_ms:
                    type: integer
        timeline:
          type: array
          description: One entry per hour, silent hours included, oldest first.
          items:
            type: object
            properties:
              hour:
                type: string
                example: '2026-11-02T21:00:00Z'
              requests:
                type: integer
              success:
                type: integer
              failed:
                type: integer
              skipped:
                type: integer

    ForwardTarget:
      type: object
      description: |
        Circuit breaker state for one forward address. A target that keeps failing
        is skipped rather than retried by every delivery: skipping is recorded as
        `skipped`, which deliberately does not count toward the workflow's failure
        streak, so one dead endpoint cannot pause the rule that would recover with
        it.
      properties:
        address:
          type: string
          example: https://down.example.com:443
        state:
          type: string
          enum: [closed, open, half_open]
          description: |
            `open` refuses, `half_open` allows exactly one probe, `closed` is
            normal operation.
        consecutive_failures:
          type: integer
        retry_in:
          type: integer
          description: Seconds until one probe is allowed. `0` when closed.
        opened_at:
          type: string
          format: date-time
          nullable: true
        next_probe_at:
          type: string
          format: date-time
          nullable: true
        last_status:
          type: integer
          nullable: true
          description: HTTP status of the last attempt, `null` for a transport error.
        last_error:
          type: string
          nullable: true
        last_failure_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
        threshold:
          type: integer
          description: Terminal failures in a row before the address is refused.
        cooldown_seconds:
          type: integer
          description: How long an open address is skipped.

    RoomDocument:
      type: object
      required: [workflows]
      properties:
        format:
          type: string
          example: hookdock.room
        version:
          type: integer
          example: 1
        exported_at:
          type: string
          format: date-time
        room:
          type: object
          description: Informational; the import ignores it.
          properties:
            name:
              type: string
            slug:
              type: string
            endpoint:
              type: string
            dedup_header:
              type: string
              nullable: true
            require_timestamp:
              type: boolean
            has_secret:
              type: boolean
        workflows:
          type: array
          maxItems: 50
          items:
            type: object
            required: [name, actions]
            properties:
              name:
                type: string
              endpoint:
                type: string
              enabled:
                type: boolean
              priority:
                type: integer
              stop_processing:
                type: boolean
              conditions:
                $ref: '#/components/schemas/ConditionTree'
              actions:
                type: array
                items:
                  $ref: '#/components/schemas/Action'

    WorkflowInput:
      type: object
      required: [name, actions]
      properties:
        room:
          type: string
          description: Room slug. `room_id` is accepted instead.
        room_id:
          type: integer
        name:
          type: string
          maxLength: 160
        endpoint:
          type: string
          default: '*'
          description: Endpoint slug within the room; `*` matches all of them.
        enabled:
          type: boolean
          default: true
        priority:
          type: integer
          minimum: 0
          maximum: 1000
          default: 0
          description: Higher runs first. Queued with `ORDER BY priority DESC, id`.
        stop_processing:
          type: boolean
          default: false
          description: |
            A **successful** run marks the request's other `pending` runs
            `skipped`, with a message naming this rule. `failed` and `skipped`
            never stop anything.
        schedule_cron:
          type: string
          nullable: true
          maxLength: 120
          description: |
            Five-field cron expression in **UTC**. This field *is* the trigger
            switch: set it and the rule fires on a schedule instead of on a
            webhook; send `""` (or `null`) and it becomes a webhook rule again.

            Supported: `*`, `n`, `a-b`, `*/n`, `a-b/n`, comma lists. No month or
            weekday names, no `@daily`, `?`, `L`, `W` or `#`. `7` is Sunday.
            When both day-of-month and day-of-week are restricted either may
            match (standard cron). An expression that never fires
            (`0 0 31 2 *`) is `422`.

            A scheduled fire has no request: the body, headers and query are
            empty and conditions are not evaluated. Missed slots are fired once —
            the next slot is computed from now, not from the one that was missed.
        actions_version:
          type: integer
          description: |
            Optimistic lock on the action list. Send the value the rule was
            loaded with; a mismatch answers `409`. Omitted means "do not check",
            which is what a script that never read the rule needs.
        conditions:
          $ref: '#/components/schemas/ConditionTree'
        actions:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/Action'

    Workflow:
      allOf:
        - $ref: '#/components/schemas/WorkflowInput'
        - type: object
          properties:
            id:
              type: integer
            room_id:
              type: integer
            condition_count:
              type: integer
              description: Leaf conditions, not groups.
            trigger_type:
              type: string
              enum: [webhook, schedule]
              description: Derived from `schedule_cron`; never stored twice.
            schedule_next_at:
              type: string
              format: date-time
              nullable: true
              description: |
                The single queue the worker's scheduler reads. Recalculated on
                save, on enabling the rule and on a version rollback; a manual
                «Запустить сейчас» leaves it alone.
            schedule_description:
              type: string
              nullable: true
              description: |
                One-line Russian reading of the expression («ежедневно в 09:00
                UTC»). Present only for a scheduled rule.
            actions_version:
              type: integer
              description: |
                Bumped only when the action list actually changes. The editor
                sends it back on save to detect a concurrent edit.
            consecutive_failures:
              type: integer
              description: Terminal failures in a row; reset by a success or by enabling the rule.
            disabled_reason:
              type: string
              nullable: true
              description: Set only by the automatic pause.
            disabled_at:
              type: string
              format: date-time
              nullable: true
            auto_paused:
              type: boolean
              description: Derived (`!enabled && disabled_reason`); never stored.
            last_run_at:
              type: string
              format: date-time
              nullable: true
            last_run_status:
              type: string
              nullable: true
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
