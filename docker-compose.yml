name: webhook-router

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-webhooks}
      POSTGRES_USER: ${DB_USER:-webhooks}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-webhooks}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-webhooks} -d ${DB_NAME:-webhooks}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-webhooks}
      DB_USER: ${DB_USER:-webhooks}
      DB_PASSWORD: ${DB_PASSWORD:-webhooks}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      JWT_TTL: ${JWT_TTL:-43200}
      APP_DEBUG: ${APP_DEBUG:-0}
      WS_CHANNEL: ${WS_CHANNEL:-hookdock_events}
      WS_TICKET_TTL: ${WS_TICKET_TTL:-60}
      ROUTING_MAX_ATTEMPTS: ${ROUTING_MAX_ATTEMPTS:-3}
      ROUTING_RETRY_BASE: ${ROUTING_RETRY_BASE:-1}
      FORWARD_TIMEOUT: ${FORWARD_TIMEOUT:-8}
      FORWARD_ALLOW_INTERNAL: ${FORWARD_ALLOW_INTERNAL:-0}
      FORWARD_BLOCKED_HOSTS: ${FORWARD_BLOCKED_HOSTS:-}
      # Read by the breaker dashboard and the dry run, so the numbers shown are the
      # numbers the worker applies.
      FORWARD_BREAKER_THRESHOLD: ${FORWARD_BREAKER_THRESHOLD:-2}
      FORWARD_BREAKER_COOLDOWN: ${FORWARD_BREAKER_COOLDOWN:-60}
      DEMO_LOGIN: ${DEMO_LOGIN:-1}
      DEMO_EMAIL: ${DEMO_EMAIL:-admin@hookdock.local}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-123456}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-10}
      LOGIN_IP_MAX_ATTEMPTS: ${LOGIN_IP_MAX_ATTEMPTS:-50}
      LOGIN_WINDOW_SECONDS: ${LOGIN_WINDOW_SECONDS:-60}
      INGEST_MAX_PER_WINDOW: ${INGEST_MAX_PER_WINDOW:-0}
      INGEST_WINDOW_SECONDS: ${INGEST_WINDOW_SECONDS:-60}
      # `/api/health` turns red when the queue's oldest pending run is older than
      # this, and when no worker beat within WORKER_STALE_SECONDS.
      HEALTH_QUEUE_MAX_AGE: ${HEALTH_QUEUE_MAX_AGE:-300}
      WORKER_STALE_SECONDS: ${WORKER_STALE_SECONDS:-60}
    # Compose and orchestrators use this as readiness. The api container runs fpm,
    # not nginx, so the check talks to the same services the API does instead of
    # curling a port that is not open there.
    healthcheck:
      test: ["CMD-SHELL", "php /var/www/backend/bin/healthcheck.php"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Realtime websocket daemon: same image as `api`, different command. It LISTENs
  # on Postgres and broadcasts to browsers; nginx reaches it at ws:8081.
  ws:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: ["php", "/var/www/backend/bin/ws-server.php"]
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-webhooks}
      DB_USER: ${DB_USER:-webhooks}
      DB_PASSWORD: ${DB_PASSWORD:-webhooks}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      WS_CHANNEL: ${WS_CHANNEL:-hookdock_events}
      WS_HOST: 0.0.0.0
      WS_PORT: "8081"
      RUN_MIGRATIONS: "0"
    expose:
      - "8081"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Routing worker: claims queued runs from `workflow_runs` and performs the
  # actions, so the receiver can answer 202 before any HTTP forward happens.
  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: ["php", "/var/www/backend/bin/worker.php"]
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-webhooks}
      DB_USER: ${DB_USER:-webhooks}
      DB_PASSWORD: ${DB_PASSWORD:-webhooks}
      WS_CHANNEL: ${WS_CHANNEL:-hookdock_events}
      ROUTING_MAX_ATTEMPTS: ${ROUTING_MAX_ATTEMPTS:-3}
      ROUTING_RETRY_BASE: ${ROUTING_RETRY_BASE:-1}
      ROUTING_STALE_MINUTES: ${ROUTING_STALE_MINUTES:-5}
      FORWARD_TIMEOUT: ${FORWARD_TIMEOUT:-8}
      FORWARD_ALLOW_INTERNAL: ${FORWARD_ALLOW_INTERNAL:-0}
      FORWARD_BLOCKED_HOSTS: ${FORWARD_BLOCKED_HOSTS:-}
      # Circuit breaker per forward address. The threshold and cooldown live in the
      # worker because that is the only process that calls a target; the api reads
      # them for the dashboard and the dry run, so both get the same numbers.
      FORWARD_BREAKER_THRESHOLD: ${FORWARD_BREAKER_THRESHOLD:-2}
      FORWARD_BREAKER_COOLDOWN: ${FORWARD_BREAKER_COOLDOWN:-60}
      FORWARD_BREAKER_DEFERRALS: ${FORWARD_BREAKER_DEFERRALS:-3}
      RETENTION_DAYS: ${RETENTION_DAYS:-0}
      RETENTION_RUN_DAYS: ${RETENTION_RUN_DAYS:-0}
      RETENTION_INTERVAL_SECONDS: ${RETENTION_INTERVAL_SECONDS:-3600}
      # Failure alerting: a terminal run failure is counted, and the workflow is
      # paused after this many in a row (0 = never pause automatically). Empty
      # ALERT_WEBHOOK_URL keeps the notification off; the counters and the pause
      # still work, so the UI shows the problem without an external service.
      WORKFLOW_FAILURE_THRESHOLD: ${WORKFLOW_FAILURE_THRESHOLD:-3}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_COOLDOWN_SECONDS: ${ALERT_COOLDOWN_SECONDS:-900}
      RUN_MIGRATIONS: "0"
    depends_on:
      db:
        condition: service_healthy
      # `api` applies migrations; the worker reads the columns they add.
      api:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - api
      - ws
    restart: unless-stopped

volumes:
  pgdata:
