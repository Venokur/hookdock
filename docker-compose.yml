name: webhook-router

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-webhooks}
      POSTGRES_USER: ${DB_USER:-webhooks}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-webhooks}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-webhooks} -d ${DB_NAME:-webhooks}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-webhooks}
      DB_USER: ${DB_USER:-webhooks}
      DB_PASSWORD: ${DB_PASSWORD:-webhooks}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      JWT_TTL: ${JWT_TTL:-43200}
      APP_DEBUG: ${APP_DEBUG:-0}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
