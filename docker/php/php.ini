; Application overrides for the api container
date.timezone = UTC
expose_php = Off
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED

memory_limit = 256M
max_execution_time = 60
post_max_size = 16M
upload_max_filesize = 16M

; Webhook bodies are read from php://input. PHP's own form parsing has to stay
; off: for multipart/form-data it consumes the stream, so php://input would be
; empty and the catcher would store every multipart webhook as an empty body.
; $_POST/$_FILES are not used anywhere in the backend.
enable_post_data_reading = Off
