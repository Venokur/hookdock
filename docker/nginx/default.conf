server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.html;
    server_tokens off;
    client_max_body_size 16m;

    # `api` and `ws` are recreated on every `compose up --build`, and a rebuilt
    # container gets a new IP. Without a resolver nginx resolves the names once at
    # startup and keeps proxying to the old address (502 until `web` is restarted).
    # Docker's embedded DNS is 127.0.0.11 on a user-defined network.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Realtime websocket (container `ws`). An exact match is required: `^~ /api/ws`
    # would also swallow POST /api/ws/ticket, and a plain prefix would lose to the
    # regex location below (nginx prefers regex over prefixes). The short-lived
    # ticket travels in the query string, so keep it out of the access log.
    location = /api/ws {
        access_log off;
        set $ws_upstream ws:8081;
        proxy_pass http://$ws_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API and webhook catcher are handled by the PHP-FPM container.
    location ~ ^/(api|hook)/ {
        include fastcgi_params;
        set $api_upstream api:9000;
        fastcgi_pass $api_upstream;
        fastcgi_index index.php;

        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param PATH_INFO $uri;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        # Without this the api container only sees nginx's own address (REMOTE_ADDR),
        # so per-client rate limits would count every user as one. nginx overwrites
        # the header with $remote_addr, so a client cannot spoof it here; fpm is not
        # published, so nothing else can talk to it directly.
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        fastcgi_read_timeout 60s;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history-mode fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;
}
