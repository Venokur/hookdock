server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.html;
    server_tokens off;
    client_max_body_size 16m;

    # Realtime websocket (container `ws`). An exact match is required: `^~ /api/ws`
    # would also swallow POST /api/ws/ticket, and a plain prefix would lose to the
    # regex location below (nginx prefers regex over prefixes). The short-lived
    # ticket travels in the query string, so keep it out of the access log.
    location = /api/ws {
        access_log off;
        proxy_pass http://ws:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API and webhook catcher are handled by the PHP-FPM container.
    location ~ ^/(api|hook)/ {
        include fastcgi_params;
        fastcgi_pass api:9000;
        fastcgi_index index.php;

        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param PATH_INFO $uri;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_read_timeout 60s;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history-mode fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;
}
