<!doctype html>
<html lang="ru" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f7fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)" />
    <!-- The SVG is the one the browser uses when it can render it; the ICO is
         for the rest. Both are generated from the same geometry as BrandMark,
         so the tab, the sidebar and the splash cannot drift apart. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Hookdock — вебхук-роутер</title>
    <script>
      try {
        if (localStorage.getItem('wr_theme') === 'dark') {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}

      // The app behind the splash is already taller than the viewport, so the page
      // got its scrollbar while the splash was still covering it: the scrollbar
      // appeared, the splash (a fixed box centred in the shrunken viewport) shifted
      // sideways, and a wheel over the splash scrolled the page underneath it.
      // The lock is set here, before the first paint, and main.js removes it when
      // the splash is actually gone — not when it starts fading.
      document.documentElement.classList.add('splash-lock')

      // Stamped here, in the head, because this is the closest moment to the
      // splash being painted that the bundle can observe. main.js measures its
      // minimum against it instead of against navigation start: on a slow load
      // the HTML itself can arrive after 350 ms, and the splash would then be
      // dismissed in the same frame it appeared.
      window.__splashAt = performance.now()
    </script>
    <style>
      /*
       * The boot splash carries its own styles on purpose: it has to be painted
       * from the first HTML byte, so it cannot borrow anything from main.css or
       * from the entry chunk — by the time either arrives, the screen it exists
       * to cover is already over. The colours are the same tokens, copied.
       */
      html,
      body {
        height: 100%;
      }

      /*
       * The strip for the scrollbar is reserved from the very first frame, and it
       * has to be declared here rather than in main.css: by the time the bundle
       * arrives the page is already painted, so a rule added there would reflow
       * the content once, under the splash.
       *
       * Without it the unlock below moved everything by 10px: while the scroll is
       * locked there is no bar and the viewport is 10px wider (card measured 951px),
       * then the bar appears and the content shrinks (941px) — the jump the splash
       * is supposed to hide. With the strip always reserved the bar appears inside
       * space that is already taken, so unlock measures 941px before and after.
       * It also removes the same jump from ordinary pages that grow past the
       * viewport (a filter change, a live row, a longer run list).
       *
       * The price is a 10px strip of body background on short pages (login, empty
       * states) and a splash 10px narrower than the window. Both are the background
       * colour, so they read as a margin rather than as a missing scrollbar.
       * Browsers without `scrollbar-gutter` (older Safari/Firefox) keep the old
       * behaviour; on macOS and iOS bars are overlaid and take no space anyway.
       */
      html {
        scrollbar-gutter: stable;
      }

      /*
       * Scroll is held back until the splash is gone: `overflow: hidden` on the
       * root is what stops a wheel over the splash from scrolling the page behind
       * it. The lock hides the bar, but the strip it would occupy stays reserved
       * (above), so releasing the lock does not move the content.
       */
      html.splash-lock,
      html.splash-lock body {
        overflow: hidden;
      }

      body {
        margin: 0;
        background-color: #f5f7fb;
      }

      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #f5f7fb;
        color: #0f172a;
        font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        transition: opacity 180ms ease;
      }

      html.dark body,
      html.dark #splash {
        background-color: #020617;
      }

      html.dark #splash {
        color: #e2e8f0;
      }

      #splash.is-done {
        opacity: 0;
        pointer-events: none;
      }

      .splash-stack {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }

      .splash-mark {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border-radius: 14px;
        background-color: #0f172a;
        color: #fff;
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.35);
      }

      .splash-mark svg {
        width: 26px;
        height: 26px;
      }

      /* Graphite on a near-black dark page needs an edge, or the tile dissolves
         into the splash background. */
      html.dark .splash-mark {
        outline: 1px solid rgba(148, 163, 184, 0.32);
        outline-offset: -1px;
        box-shadow: none;
      }

      .splash-title {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
      }

      .splash-ring {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 2px solid currentColor;
        border-top-color: transparent;
        opacity: 0.5;
        animation: splash-spin 700ms linear infinite;
      }

      .splash-hint {
        margin: 0;
        font-size: 12px;
        opacity: 0.65;
      }

      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* A spinner that keeps spinning is exactly what this setting asks us not to do. */
      @media (prefers-reduced-motion: reduce) {
        #splash {
          transition: none;
        }

        .splash-ring {
          animation: none;
        }
      }
    </style>
  </head>
  <body class="h-full">
    <!-- Plain markup, removed by main.js once the first route is actually
         renderable. A splash rendered *by* Vue would appear after the bundle
         that it is meant to cover. -->
    <div id="splash" role="status" aria-live="polite">
      <div class="splash-stack">
        <div class="splash-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round">
            <path d="M9.6 8v16" />
            <path d="M22.4 8v16" />
            <path d="M9.6 16h12.8" />
          </svg>
        </div>
        <p class="splash-title">Hookdock</p>
        <div class="splash-ring" aria-hidden="true"></div>
        <p class="splash-hint">Загрузка интерфейса…</p>
      </div>
    </div>
    <div id="app" class="h-full"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
